<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskManager — Interactive Visualizer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2334d399' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolygon points='12 2 2 7 12 12 22 7 12 2'/%3E%3Cpolyline points='2 17 12 22 22 17'/%3E%3Cpolyline points='2 12 12 17 22 12'/%3E%3C/svg%3E">
  <style>
<!--slot:tailwind-css-->
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Sections render as-is from a node's own content, and the page now writes content too,
       so every marked.parse() result is sanitised through this before it reaches the DOM. -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
<!--slot:app-css-->
  </style>
<!--slot:runtime-data-->
<!--slot:static-data-->
</head>
<body class="bg-zinc-950 text-zinc-100 flex flex-col h-screen overflow-hidden selection:bg-emerald-500 selection:text-black">
<!--slot:icon-sprite-->

  <!-- Toolbar: brand, view switcher, search and filters on row 1; status counts on row 2 -->
  <header id="toolbar" class="border-b border-zinc-800 px-4 py-2 bg-zinc-900/60 backdrop-blur z-20 flex-shrink-0 space-y-2">
    <div class="flex items-center gap-3 flex-wrap lg:flex-nowrap">
      <div class="flex items-center gap-2 flex-shrink-0">
        <svg id="brand-icon" class="w-5 h-5 text-emerald-400 transition-colors" fill="none" stroke="currentColor"><title id="brand-icon-title">Synced</title><use href="#icon-layers"/></svg>
        <span class="text-sm font-semibold tracking-wide text-zinc-100 hidden sm:inline">TaskManager</span>
      </div>

      <div class="h-8 bg-zinc-900 p-0.5 rounded-lg border border-zinc-800 flex text-xs flex-shrink-0">
        <button id="view-doc-btn" title="Document view" aria-label="Document view" class="h-full aspect-square flex items-center justify-center rounded-md font-medium bg-zinc-800 text-white shadow-sm transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor"><use href="#icon-file-text"/></svg>
        </button>
        <button id="view-graph-btn" title="Graph view" aria-label="Graph view" class="h-full aspect-square flex items-center justify-center rounded-md font-medium text-zinc-400 hover:text-white transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor"><use href="#icon-network"/></svg>
        </button>
        <button id="view-waves-btn" title="Waves view" aria-label="Waves view" class="h-full aspect-square flex items-center justify-center rounded-md font-medium text-zinc-400 hover:text-white transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor"><use href="#icon-layers"/></svg>
        </button>
        <button id="view-decisions-btn" title="Decisions view" aria-label="Decisions view" class="relative h-full aspect-square flex items-center justify-center rounded-md font-medium text-zinc-400 hover:text-white transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor"><use href="#icon-help-circle"/></svg>
          <span id="decisions-badge" class="hidden absolute -top-1.5 -right-1.5 min-w-[16px] h-4 px-1 rounded-full bg-amber-500 text-black text-[10px] font-bold leading-4 text-center">0</span>
        </button>
      </div>

      <div class="relative flex-1 min-w-[160px]">
        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-zinc-500">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor"><use href="#icon-search"/></svg>
        </div>
        <input id="search-box" type="text" placeholder="Filter" aria-label="Filter" class="h-8 w-full bg-zinc-950 border border-zinc-800 rounded-lg pl-8 pr-3 text-xs text-zinc-200 placeholder-zinc-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
      </div>

      <div class="hidden lg:block w-px h-6 bg-zinc-800 flex-shrink-0"></div>

      <!-- Below `sm` the five filter controls plus + New routinely wrap the toolbar onto 3-4
           lines, leaving no height for the document below it; a single toggle keeps the
           toolbar one row there while 768/1440 (>= sm) show the controls inline as before. -->
      <button id="filters-toggle-btn" type="button" aria-expanded="false" aria-controls="filter-controls-group"
        class="sm:hidden h-8 px-2.5 flex items-center gap-1 rounded-lg text-xs bg-zinc-950 text-zinc-300 border border-zinc-800 hover:bg-zinc-900 flex-shrink-0">
        <span class="filters-toggle-label">Filters</span>
      </button>
      <div id="filter-controls-group" class="hidden sm:flex sm:max-lg:order-last flex-wrap items-center gap-1.5 text-xs">
        <div id="repo-filter" class="relative"></div>
        <div id="model-filter" class="relative"></div>
        <div id="spec-filter" class="relative"></div>
        <div id="phase-filter" class="relative"></div>
        <div id="score-filter" class="relative"></div>
        <button id="clear-filters-btn" class="hidden h-8 px-2 flex items-center rounded-lg text-zinc-400 hover:text-white underline decoration-dotted">Clear</button>
      </div>
      <div id="toolbar-actions" class="sm:max-lg:order-last"></div>

      <div class="hidden lg:block w-px h-6 bg-zinc-800 flex-shrink-0"></div>

      <div class="flex items-center gap-1.5 flex-shrink-0 lg:ml-auto">
        <div id="sort-control" role="group" aria-label="Sort" class="h-8 bg-zinc-900 p-0.5 rounded-lg border border-zinc-800 flex text-xs flex-shrink-0">
          <button type="button" data-sort="progress" aria-pressed="true" class="h-full px-2.5 flex items-center rounded-md font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400 bg-zinc-800 text-white shadow-sm">Progress</button>
          <button type="button" data-sort="priority" aria-pressed="false" class="h-full px-2.5 flex items-center rounded-md font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400 text-zinc-400 hover:text-white">Priority</button>
        </div>
        <button id="toggle-sections-btn" title="Expand all sections" aria-label="Expand all sections" class="h-8 aspect-square flex items-center justify-center rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 hover:text-white transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor"><use href="#icon-chevrons-up-down"/></svg>
        </button>
        <button id="legend-btn" aria-expanded="false" aria-controls="legend-panel" title="Legend" aria-label="Legend" class="h-8 aspect-square flex items-center justify-center rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-xs text-zinc-300 hover:text-white transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor"><use href="#icon-info"/></svg>
        </button>
        <button id="refresh-btn" title="Refresh state" aria-label="Refresh state" class="h-8 aspect-square flex items-center justify-center rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 hover:text-white transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor"><use href="#icon-rotate-cw"/></svg>
        </button>
      </div>
    </div>

    <div id="stats-digest" class="flex items-center justify-center gap-1 flex-wrap text-xs"></div>
  </header>

  <!-- A subscribe on the estate's own 541-task tree can still take a couple of seconds; with
       nothing here the waves/graph/document pane just stays blank for that whole stretch, on first
       load and again after every write, with no way to tell a slow load from a broken one. -->
  <div id="load-indicator" role="status" aria-live="polite" class="hidden fixed top-0 inset-x-0 z-50">
    <div class="h-0.5 bg-emerald-500 animate-pulse"></div>
    <span class="sr-only">Loading…</span>
  </div>

  <!-- Status legend -->
  <div id="legend-panel" role="dialog" aria-label="Status legend" class="hidden fixed top-16 right-4 w-[26rem] max-w-[calc(100vw-2rem)] max-h-[75vh] overflow-y-auto z-40 rounded-xl border border-zinc-700 bg-zinc-900 shadow-2xl p-4 space-y-2">
    <div class="flex items-start justify-end">
      <button id="legend-close-btn" aria-label="Close legend" class="p-1 rounded-md text-zinc-400 hover:text-white hover:bg-zinc-800 flex-shrink-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor"><use href="#icon-x"/></svg>
      </button>
    </div>
    <div id="legend-body"></div>
  </div>

  <!-- Main View Area -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- Sidebar / Hierarchical Navigation (Graph view only) -->
    <aside id="sidebar-pane" class="hidden relative border-r border-zinc-800 flex flex-col bg-zinc-900/40 flex-shrink-0" style="width:320px">
      <div class="p-3 border-b border-zinc-800 flex items-center justify-between gap-2">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400">Nodes</span>
        <button id="expand-all-btn" title="Expand all" aria-label="Expand all tree nodes" class="h-7 w-7 flex items-center justify-center rounded-md bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 hover:text-zinc-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor"><use href="#icon-chevrons-up-down"/></svg>
        </button>
      </div>
      <div id="tree-list" role="tree" aria-label="Nodes" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- Dynamically Populated Tree -->
      </div>
      <div id="sidebar-resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize" class="absolute top-0 right-0 w-1.5 h-full cursor-col-resize hover:bg-emerald-500/40"></div>
    </aside>

    <!-- Document View Pane -->
    <main id="document-pane" class="flex-1 overflow-y-auto p-6 space-y-8 bg-zinc-950">
      <div id="unified-document" class="max-w-4xl mx-auto space-y-8 pb-16">
        <!-- Dynamically rendered unified spec document -->
      </div>
    </main>

    <!-- Graph View Pane -->
    <section id="graph-pane" class="hidden flex-1 flex flex-col bg-zinc-950/80 overflow-hidden relative">
      <div id="graph-fit-wrap" class="hidden absolute top-3 right-3 z-10 flex gap-2">
        <button id="graph-fit-btn" class="h-7 flex items-center gap-1.5 px-2.5 text-[11px] font-medium rounded-md bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor"><use href="#icon-maximize-2"/></svg>
          <span>Fit View</span>
        </button>
      </div>
      <div id="network-canvas" class="hidden w-full h-full"></div>

      <!-- Waves view: rendered inside graph-pane -- core.js's setViewMode(WAVES) keeps
           graph-pane itself visible and swaps #network-canvas/#graph-fit-wrap for this
           instead. waves.js owns everything under #waves-content. -->
      <div id="waves-pane" class="hidden absolute inset-0 overflow-y-auto p-4 sm:p-6 bg-zinc-950">
        <div id="waves-content" class="max-w-4xl mx-auto space-y-4 pb-16"></div>
      </div>
    </section>

    <!-- Decisions View Pane (§6.4): list of open/answered/withdrawn decisions and a detail
         panel, toggled on by decisions.js -- hidden by default like the graph pane. From sm up
         the list and the detail scroll side by side. Below sm the decision is the page, the pane
         is its one scroll, and decisions.js moves the tabs and the list into a drawer while it is
         open; the scroll padding keeps a focused field clear of the sticky page bar and the fixed
         answer bar, and the detail's 140px bottom padding keeps its last field clear of the bar.
         decisions.js keeps both scroll offsets itself across a re-render, so the browser's own
         scroll anchoring is off here. -->
    <section id="decisions-pane" class="hidden flex-1 flex flex-col sm:flex-row overflow-y-auto sm:overflow-hidden [overflow-anchor:none] max-sm:scroll-pt-[45px] max-sm:scroll-pb-[81px] bg-zinc-950">
      <aside class="hidden sm:flex w-80 md:w-96 flex-shrink-0 border-r border-zinc-800 flex-col overflow-hidden">
        <div id="decisions-tabs" role="tablist" aria-label="Decision status" class="flex items-center gap-1 px-4 py-3 sm:px-3 flex-shrink-0"></div>
        <div id="decisions-list" class="flex-1 min-h-0 overflow-y-auto px-4 pt-1 pb-3 sm:px-2 space-y-2"></div>
      </aside>
      <div id="decisions-detail" class="flex-1 min-w-0 sm:overflow-y-auto [overflow-anchor:none] px-4 pt-5 pb-[140px] sm:px-6 sm:pt-6 sm:pb-16"></div>
    </section>

    <!-- Node detail drawer, shared by the Waves, Graph and Document views: it sits over
         whichever pane is showing. Full width below lg: at 375/768 a fixed 384px (w-96)
         panel next to a 320px sidebar left no usable canvas. detail.js fills its header
         line, title, pills and body. -->
    <div id="graph-inspector" role="dialog" aria-modal="true" aria-labelledby="inspector-title" class="hidden absolute top-0 right-0 w-full lg:w-96 h-full bg-zinc-900 border-l border-zinc-800 z-20 flex flex-col shadow-2xl">
      <div class="px-4 py-3.5 border-b border-zinc-800 space-y-2 flex-shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <div id="inspector-line" class="flex flex-1 flex-wrap items-center gap-x-2 gap-y-1 min-w-0"></div>
          <div id="inspector-actions" class="flex-shrink-0"></div>
          <button id="inspector-close-btn" type="button" aria-label="Close details" class="w-7 h-7 flex items-center justify-center flex-shrink-0 rounded-md text-zinc-400 hover:text-white hover:bg-zinc-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor"><use href="#icon-x"/></svg>
          </button>
        </div>
        <h2 id="inspector-title" tabindex="-1" class="text-sm leading-5 font-semibold text-zinc-100 break-words focus:outline-none"></h2>
        <div id="inspector-pills" class="flex flex-wrap items-center gap-1.5"></div>
      </div>
      <div id="inspector-body" class="flex-1 min-h-0 overflow-y-auto p-4 text-xs"></div>
    </div>

  </div>

  <!-- Ahead of every script block below: core.js reads these by id while it runs, and a
       marker placed after the scripts (the layout the old end-of-body divs used) is still
       unparsed at that point, so getElementById would return null. -->
  <div id="dialog-root"></div>
  <div id="toast-root"></div>

  <script>
<!--slot:js-store-->
  </script>
  <script>
<!--slot:js-core-->
  </script>
  <script>

  </script>
  <script>

  </script>
  <script>

  </script>
  <script>
<!--slot:js-edit-->
  </script>
  <script>
<!--slot:js-detail-->
  </script>
  <script>
<!--slot:js-waves-->
  </script>
  <script>
<!--slot:js-decisions-->
  </script>
  <script>
<!--slot:js-main-->
  </script>
</body>
</html>
